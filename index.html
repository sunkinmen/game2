<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>台北格鬥風雲</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台北格鬥">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07080c;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #game{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#000;touch-action:none;image-rendering:auto}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffd870;font:900 28px "Noto Sans TC",sans-serif;letter-spacing:.2em;pointer-events:none}
  noscript{color:#fff;position:fixed;top:40%;width:100%;text-align:center;font:20px sans-serif}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="boot">載入中…</div>
<noscript>需要啟用 JavaScript 才能遊玩。</noscript>
<script src="js/config.js"></script>
<script src="js/save.js"></script>
<script src="js/fsettings.js"></script>
<script src="js/finput.js"></script>
<script src="js/ftouch.js"></script>
<script src="js/pen.js"></script>
<script src="js/rig.js"></script>
<script src="js/roster.js"></script>
<script src="js/moves.js"></script>
<script src="js/fxaudio.js"></script>
<script src="js/brush.js"></script>
<script src="js/sprites.js"></script>
<script src="js/ui.js"></script>
<script src="js/fighter.js"></script>
<script src="js/combat.js"></script>
<script src="js/ai.js"></script>
<script src="js/stage.js"></script>
<script src="js/fight.js"></script>
<script src="js/select.js"></script>
<script src="js/menu.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/loading.js"></script>
<script src="js/game.js"></script>
<script>window.addEventListener('load',function(){var b=document.getElementById('boot');if(b)b.remove();});</script>
</body>
</html>
